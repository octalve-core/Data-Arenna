<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" class="iconMeta" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
	<meta name="theme-color" content="#01579b" />
	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
	<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
	<meta name="description" id="descriptionMeta" content="Buy Cheap Internet Data Plan and Airtime Recharge" />
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
		rel="stylesheet">
	<link
		href="https://fonts.googleapis.com/css2?family=KoHo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
		rel="stylesheet">
	<link rel="apple-touch-icon" class="iconMeta" />
	<link
		href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
		rel="stylesheet">

	<title id="titleMeta">Buy Airtime and Data for all Network. Make payment for DSTV, GoTv</title>
	<style>
		.preloader {
			position: fixed;
			width: 100%;
			height: 100%;
			z-index: 999999999 !important;
			background: #000;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
		}

		.centered {
			width: 400px;
			height: 400px;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: #000;
			filter: blur(10px) contrast(20);
		}

		.blob-1,
		.blob-2 {
			width: 70px;
			height: 70px;
			position: absolute;
			background: #fff;
			border-radius: 50%;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}

		.blob-1 {
			left: 20%;
			animation: osc-l 2.5s ease infinite;
		}

		.blob-2 {
			left: 80%;
			animation: osc-r 2.5s ease infinite;
			background: #0ff;
		}

		@keyframes osc-l {
			0% {
				left: 20%;
			}

			50% {
				left: 50%;
			}

			100% {
				left: 20%;
			}
		}

		@keyframes osc-r {
			0% {
				left: 80%;
			}

			50% {
				left: 50%;
			}

			100% {
				left: 80%;
			}
		}
	</style>
</head>

<body>
	<noscript>You need to enable JavaScript to run this app.</noscript>
	<div class="preloader preloader-dark">
		<div class="lds-ellipsis centered">
			<div class="blob-1"></div>
			<div class="blob-2"></div>
		</div>
	</div>
	<div id="root"></div>

	<script src="../src/description.js"></script>
	<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
	<script>
		AOS.init({
			once: false,
		});
	</script>
</body>

</html>
